name: Build Vaultly Ai App (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Generate Native Android Project
        run: |
          mkdir -p app/src/main/java/com/vaultly/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi

          # Set App Icon: convert logo.png into a real 72x72 PNG (works even if the file is JPG/WebP renamed)
          if [ -f "logo.png" ]; then
            convert "logo.png[0]" -resize 72x72! PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png || rm -f app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          # 1. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          echo "include ':app'" > settings.gradle

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaultly.ai'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vaultly.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Vaultly Ai"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # If no valid icon was produced, remove the icon line so the build doesn't fail
          if [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            sed -i '/android:icon=/d' app/src/main/AndroidManifest.xml
          fi

          # 6. Activity Layout XML
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
              <LinearLayout
                  android:id="@+id/offlineView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#FFFFFF"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:visibility="gone">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="No Internet Connection"
                      android:textColor="#111111"
                      android:textSize="22sp"
                      android:textStyle="bold" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:gravity="center"
                      android:text="Please check your internet and try again."
                      android:textColor="#555555"
                      android:textSize="15sp" />
                  <Button
                      android:id="@+id/retryButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Retry" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          # 7. MainActivity Java Code
          cat << 'EOF' > app/src/main/java/com/vaultly/ai/MainActivity.java
          package com.vaultly.ai;

          import android.graphics.Bitmap;
          import android.net.ConnectivityManager;
          import android.net.NetworkCapabilities;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private static final String APP_URL = "https://vaultly.site.je";
              private WebView webView;
              private View offlineView;
              private boolean hasError = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  offlineView = findViewById(R.id.offlineView);
                  Button retryButton = findViewById(R.id.retryButton);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          hasError = false;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              hasError = true;
                              showOffline(true);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (!hasError) {
                              showOffline(false);
                          }
                      }
                  });

                  retryButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (isOnline()) {
                              webView.loadUrl(APP_URL);
                          } else {
                              Toast.makeText(MainActivity.this, "Still no internet", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);

                  webView.loadUrl(APP_URL);
              }

              private void showOffline(boolean show) {
                  offlineView.setVisibility(show ? View.VISIBLE : View.GONE);
                  webView.setVisibility(show ? View.INVISIBLE : View.VISIBLE);
              }

              private boolean isOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                  if (cm == null || cm.getActiveNetwork() == null) return false;
                  NetworkCapabilities caps = cm.getNetworkCapabilities(cm.getActiveNetwork());
                  return caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2.1

      - name: Build APK and AAB
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          
