name: Build Vaultly Ai App (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web App Project
        run: |
          npm install -g cordova
          cordova create myApp com.vaultly.ai "Vaultly Ai"
          cd myApp

          # Create HTML with Webview
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <title>Vaultly Ai</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; display: block; }
              </style>
          </head>
          <body>
              <iframe src="https://vaultly.site.je" allow="geolocation; microphone; camera; display-capture"></iframe>
          </body>
          </html>
          EOF

          # Copy logo.png if available
          if [ -f "../logo.png" ]; then
            cp ../logo.png www/logo.png
            sed -i '/<\/widget>/d' config.xml
            echo '    <icon src="www/logo.png" />' >> config.xml
            echo '</widget>' >> config.xml
          fi

          # Add Android platform
          cordova platform add android@11.0.0

          # Build APK & AAB using wrapper
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-AAB
          path: myApp/platforms/android/app/build/outputs/bundle/release/app-release.aab
