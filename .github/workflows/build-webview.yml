name: Build Vaultly Ai App (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build App with Capacitor
        run: |
          # 1. Create Web Folder
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <title>Vaultly Ai</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; display: block; }
              </style>
          </head>
          <body>
              <iframe src="https://vaultly.site.je" allow="geolocation; microphone; camera; display-capture"></iframe>
          </body>
          </html>
          EOF

          # 2. Initialize Capacitor Project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Vaultly Ai" "com.vaultly.ai" --web-dir www
          npx cap add android

          # 3. Add Logo Icon if available
          if [ -f "logo.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            cp logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          # 4. Build APK & AAB
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
