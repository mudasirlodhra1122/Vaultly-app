name: Build WebView App (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# ===== AAP KI APP KI CONFIGURATION =====
env:
  APP_URL: "https://your-website.com"   # Yahan apni website ka URL likhein
  APP_NAME: "My Website App"            # Yahan apni app ka name likhein
  APP_ID: "com.mycompany.webviewapp"     # Yahan app ki Package ID likhein
  LOGO_PATH: "icon.png"                 # Project root folder mein mojud icon file ka name

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App with Icon and URL
        run: |
          # 1. HTML File Create (Website URL ke sath)
          mkdir www
          cat << EOF > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <title>${{ env.APP_NAME }}</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; display: block; }
              </style>
          </head>
          <body>
              <iframe src="${{ env.APP_URL }}" allow="geolocation; microphone; camera"></iframe>
          </body>
          </html>
          EOF

          # 2. Cordova Setup
          npm install -g cordova
          cordova create myApp ${{ env.APP_ID }} "${{ env.APP_NAME }}"
          cd myApp
          cp -r ../www/* www/

          # 3. Custom App Icon Configuration
          if [ -f "../${{ env.LOGO_PATH }}" ]; then
            echo "Custom icon found! Configuring icon..."
            cp "../${{ env.LOGO_PATH }}" www/icon.png
            echo '<widget id="${{ env.APP_ID }}" version="1.0.0" xmlns="http://www.w3.org/ns/widgets"><icon src="www/icon.png" /></widget>' > config.xml.tmp
            sed -i '/<\/widget>/d' config.xml
            echo '    <icon src="www/icon.png" />' >> config.xml
            echo '</widget>' >> config.xml
          else
            echo "No custom icon found at ${{ env.LOGO_PATH }}. Using default icon."
          fi

          # 4. Android Build
          cordova platform add android@12.0.0
          cordova build android --debug
          cordova build android --release -- --packageType=bundle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Website-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Website-AAB
          path: myApp/platforms/android/app/build/outputs/bundle/release/app-release.aab
          
