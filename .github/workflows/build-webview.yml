name: Build Vaultly Ai App (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# ===== VAULTLY AI CONFIGURATION =====
env:
  APP_URL: "https://vaultly.site.je"    # Aap ki Website ka URL
  APP_NAME: "Vaultly Ai"                # Aap ki App ka Name
  APP_ID: "com.vaultly.ai"              # App Package ID
  LOGO_PATH: "logo.png"                 # Aap ki GitHub repo wali logo file

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App with Icon and URL
        run: |
          # 1. HTML File Create (Vaultly Ai URL ke sath)
          mkdir www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <title>Vaultly Ai</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; display: block; }
              </style>
          </head>
          <body>
              <iframe src="https://vaultly.site.je" allow="geolocation; microphone; camera; display-capture"></iframe>
          </body>
          </html>
          EOF

          # 2. Cordova Setup
          npm install -g cordova
          cordova create myApp ${{ env.APP_ID }} "${{ env.APP_NAME }}"
          cd myApp
          cp -r ../www/* www/

          # 3. Custom App Icon Setup (logo.png)
          if [ -f "../${{ env.LOGO_PATH }}" ]; then
            echo "Custom logo found! Setting up icon..."
            cp "../${{ env.LOGO_PATH }}" www/logo.png
            sed -i '/<\/widget>/d' config.xml
            echo '    <icon src="www/logo.png" />' >> config.xml
            echo '</widget>' >> config.xml
          else
            echo "Warning: logo.png not found in root repository."
          fi

          # 4. Android APK & AAB Build
          cordova platform add android@12.0.0
          cordova build android --debug
          cordova build android --release -- --packageType=bundle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultly-Ai-AAB
          path: myApp/platforms/android/app/build/outputs/bundle/release/app-release.aab
          
